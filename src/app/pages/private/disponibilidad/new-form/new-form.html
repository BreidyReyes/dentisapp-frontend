<pre>{{dentist|json}}</pre> 
<form [formGroup]="formData" (ngSubmit)="onSubmit()">
    <h1>Crear Disponibilidad</h1>

    <div class="campo">
        <label for="dentist_name">Dentista</label>
        <select formControlName="dentist" id="dentist_name">
            <option value="">selecione...</option>
            @for (item of dentist; track $index) {
                <option [value]="item._id">{{item.name}}</option>
            }
        </select>
    </div>
    <div class="campo">
        <label for="diaSemana">
            dia semana
        </label>
        <select formControlName="diaSemana" id="diaSemana">
            <option value="">selecione...</option>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
        </select>
    </div>
    <div class="campo">
        <label for="horaInicio">
            hora de inicio
        </label>
        <input type="datetime" formControlName="horaInicio">
    </div>
    <div class="campo">
        <button>Registrar ☺☺</button>
    </div>
</form>
